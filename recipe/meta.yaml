{% set name = "etils" %}
{% set version = "1.15.0" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://github.com/google/etils/archive/refs/tags/v{{ version }}.tar.gz
  sha256: bddca6429d7ac155bd71d2b7260858ae924ced6dbfa5e12a00c0b8c1d0c907ed

build:
  number: 0
  skip: true  # [py<311]
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - pip
    - python
    - flit-core >=3.8,<4
  run:
    - python

test:
  requires:
    - pip
  imports:
    - etils
  commands:
    - pip check

about:
  home: https://etils.readthedocs.io
  summary: Collection of common python utils
  description: etils (eclectic utils) is an open-source collection of utils for python.
  license: Apache-2.0
  license_file: LICENSE
  license_family: Apache
  doc_url: https://etils.readthedocs.io
  dev_url: https://github.com/google/etils

extra:
  recipe-maintainers:
    - ngam
    - traversaro
